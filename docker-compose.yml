volumes:
  postgres_data:
  imposm_cache:
  imposm_expiry:
  imposm_diff:

# OIM_DOCKER_PLATFORM is set by ./dev-setup.sh from the host arch (linux/arm64 or linux/amd64).
# Official postgis/postgis:* tags are amd64-only; imresamu/postgis is a multi-arch rebuild of the
# same Dockerfiles so Apple Silicon can run natively instead of under QEMU.
services:
  db:
    image: imresamu/postgis:17-3.4-alpine
    platform: ${OIM_DOCKER_PLATFORM:-linux/amd64}
    shm_size: 1024mb
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/dev-init.sql:/docker-entrypoint-initdb.d/90-dev-init.sql
      - ./schema/functions.sql:/docker-entrypoint-initdb.d/91-functions.sql
      - ./schema/views.sql:/schema/views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  imposm:
    build: imposm
    platform: ${OIM_DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - imposm_cache:/imposm-cache
      - imposm_expiry:/imposm-expiry
      - imposm_diff:/imposm-diff
    command:
      - run
      - -expiretiles-dir
      - /imposm-expiry
      - -cachedir
      - /imposm-cache
      - -diffdir
      - /imposm-diff
      - -mapping
      - /mapping.json
      - -connection
      - "postgis://osm:osm@db/osm"
  
  tegola:
    build: tegola
    platform: ${OIM_DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URI: "postgres://osm:osm@db:5432/osm"
    ports:
      - "8080:80"

  web-backend:
    build: web-backend
    platform: ${OIM_DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      DATABASE_URL: "postgresql://osm:osm@db:5432/osm"
    ports:
      - "8081:80"
